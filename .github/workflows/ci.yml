name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check app eval tests

      - name: Format check (black)
        run: black --check app eval tests

      - name: Types (mypy)
        run: mypy app
        continue-on-error: true

      - name: Unit tests (no browser)
        run: pytest tests/ -q -m "not e2e" --cov=app --cov-report=term-missing --cov-report=xml

      - name: End-to-end tests (real Chromium + MockShop)
        run: pytest tests/ -q -m e2e

      - name: Coverage gate
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, sys
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.attrib.get("line-rate", 0)) * 100
          print(f"total line coverage: {rate:.1f}%")
          # The agent and tool layers are the product; hold them to a high bar.
          for package in ("app.agent", "app.tools"):
              total = hit = 0
              for cls in root.iter("class"):
                  name = cls.attrib.get("filename", "")
                  if not name.startswith(package.replace(".", "/")):
                      continue
                  for line in cls.iter("line"):
                      total += 1
                      hit += int(line.attrib.get("hits", "0")) > 0
              if total:
                  pct = hit / total * 100
                  print(f"{package}: {pct:.1f}% ({hit}/{total})")
          sys.exit(0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend — types, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SSE_BASE_URL: http://localhost:8000

  eval:
    name: Evaluation harness (smoke)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt && python -m playwright install --with-deps chromium

      - name: Run the first 3 evaluation tasks
        working-directory: backend
        run: python -m eval.run --tasks 3 --reset-each
        env:
          TASKPILOT_LLM_PROVIDER: scripted
          TASKPILOT_MCP_ENABLED: "false"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke
          path: backend/eval/results.md
