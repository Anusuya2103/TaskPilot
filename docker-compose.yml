# TaskPilot — one command brings up the API, the web UI, Postgres and MockShop.
#
#   cp .env.example .env && docker compose up
#
# The API falls back to the deterministic scripted brain when no LLM key is set,
# so this works on a fresh clone with an empty .env.

# Host ports are overridable so the stack can run alongside other services.
# The defaults below are the documented ones (make up reads the same vars).
#   TASKPILOT_WEB_PORT=3010 TASKPILOT_API_PORT=8010 docker compose up
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot
      POSTGRES_DB: taskpilot
    ports:
      - "${TASKPILOT_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  mockshop:
    build:
      context: ./demo-apps/mockshop
    restart: unless-stopped
    ports:
      - "${TASKPILOT_MOCKSHOP_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # Context is the repo root, not ./backend: the Dockerfile copies both
    # backend/ and demo-apps/, so it needs to see them side by side. It also
    # needs backend/alembic.ini, which lives outside backend/alembic/.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      TASKPILOT_DATABASE_URL: postgresql+asyncpg://taskpilot:taskpilot@db:5432/taskpilot
      MOCKSHOP_BASE_URL: http://mockshop:9000
      TASKPILOT_MOCKSHOP_BASE_URL: http://mockshop:9000
      # Must list the origin the *browser* uses, which is the published web
      # port — not the in-network service name.
      TASKPILOT_CORS_ORIGINS: http://localhost:${TASKPILOT_WEB_PORT:-3000},http://127.0.0.1:${TASKPILOT_WEB_PORT:-3000}
    ports:
      - "${TASKPILOT_API_PORT:-8000}:8000"
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
      mockshop:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${TASKPILOT_API_PORT:-8000}
        NEXT_PUBLIC_SSE_BASE_URL: http://localhost:${TASKPILOT_API_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${TASKPILOT_WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  artifacts:
